CONFIG_GPIO=y
CONFIG_I2C=y
CONFIG_SENSOR=y
CONFIG_BMI160=y

# Logging and shell configuration
CONFIG_LOG=y
CONFIG_SHELL=y

# Display and user interaction configuration
CONFIG_DISPLAY=y
CONFIG_INPUT=y

# LVGL configuration
CONFIG_LVGL=y
CONFIG_LV_Z_SHELL=y
CONFIG_LV_Z_MEM_POOL_SIZE=81920
CONFIG_LV_COLOR_DEPTH_32=y

# LVGL Fonts
CONFIG_LV_FONT_MONTSERRAT_12=y
CONFIG_LV_FONT_MONTSERRAT_14=y
CONFIG_LV_FONT_MONTSERRAT_16=y
CONFIG_LV_FONT_MONTSERRAT_18=y
CONFIG_LV_FONT_MONTSERRAT_24=y
